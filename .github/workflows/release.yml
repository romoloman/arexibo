name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da compilare (es. v0.7.0) -- deve gia'' esistere'
        required: true

jobs:
  build:
    name: Build .deb (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libdbus-1-dev \
            libzmq3-dev \
            qt6-webengine-dev \
            libudev-dev \
            pkg-config

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Determine version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Build .deb
        run: bash deb/build-deb.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: dist/arexibo_*.deb

  windows:
    name: Build the Windows installer
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      version: ${{ github.event.inputs.tag || github.ref_name }}
      skip_folder_artifact: true

  release:
    name: Publish release
    # Windows is not waited on to publish: while that port is experimental,
    # a failure of it must not hold back the .deb packages.
    needs: [build, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --disable-warning=DEP0040
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: deb-*
          merge-multiple: true

      - name: Download the Windows installer
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: arexibo-windows-installer
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/arexibo_*.deb
            dist/arexibo_*-win64.exe
