name: Nightly .deb build

# Builds the kiosk .deb packages (amd64 + arm64, see deb/build-deb.sh)
# every night and publishes them to a single, fixed "nightly" GitHub
# Release -- so there's always one stable URL to grab the latest build
# from, rather than having to dig through individual Actions run
# artifacts each time.
#
# Three jobs: `check` decides whether anything changed (and fixes the
# nightly version string once, so both architectures share it), `build`
# runs once per architecture, `publish` uploads everything to the
# release only if every build succeeded.
#
# Also runnable manually (workflow_dispatch) for on-demand builds
# without waiting for the schedule, e.g. right after merging a fix
# that needs testing on real hardware.

on:
  schedule:
    # 02:00 UTC daily. Skips silently (no build, no release update) if
    # master hasn't changed since the last nightly -- see the "check
    # for changes" step below.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

env:
  # Suppresses a widely-reported, benign Node.js runtime warning
  # ("DEP0040: the `punycode` module is deprecated") that shows up
  # on actions/checkout and softprops/action-gh-release -- it comes
  # from a still-unfixed transitive dependency deep in the GitHub
  # Actions toolkit's own shared libraries (not from our own
  # workflow config), affecting many unrelated projects the same
  # way (Jest, Yarn, setup-python, setup-node, ...). Targeted to
  # this one specific warning code so other, potentially useful
  # deprecation warnings still show up normally.
  NODE_OPTIONS: --disable-warning=DEP0040

jobs:
  check:
    name: Check for changes since the last nightly
    runs-on: ubuntu-26.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      nightly_version: ${{ steps.version.outputs.nightly_version }}
      windows_version: ${{ steps.version.outputs.windows_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full history for the "changed since last nightly" check

      - name: Check for changes since the last nightly
        id: check
        run: |
          # Skip the actual build entirely if master is exactly what the
          # last nightly was already built from -- avoids a pointless
          # rebuild-and-republish of byte-identical output every single
          # night when nothing changed, and the noise of a new release
          # timestamp with nothing new in it.
          if git rev-parse refs/tags/nightly >/dev/null 2>&1; then
            LAST=$(git rev-list -n 1 refs/tags/nightly 2>/dev/null || echo "")
            CURRENT=$(git rev-parse HEAD)
            if [ "$LAST" = "$CURRENT" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No changes since the last nightly build ($LAST) -- skipping."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Determine nightly version
        if: steps.check.outputs.skip != 'true'
        id: version
        run: |
          BASE_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          # `~nightly.YYYYMMDD` -- the `~` sorts *before* nothing at all
          # in dpkg's own version comparison rules, so this nightly is
          # correctly treated as "older" than the eventual real release
          # of the same base version, exactly the right semantics for a
          # pre-release build (e.g. `0.6.0~nightly.20260816` < `0.6.0`).
          # Computed once here, not per architecture: a build that crosses
          # midnight UTC must not leave the two .deb files with different
          # versions.
          NIGHTLY_VERSION="${BASE_VERSION}~nightly.$(date -u +%Y%m%d)"
          echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          # The same version for the Windows installer, where the `~` is not
          # wanted (it is only for dpkg): derived, so that they cannot differ.
          echo "windows_version=${NIGHTLY_VERSION/\~/-}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${NIGHTLY_VERSION}"

  build:
    name: Build nightly .deb (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.skip != 'true'
    strategy:
      # Let the other architecture finish so both results are visible;
      # `publish` still requires every leg to succeed.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libdbus-1-dev \
            libzmq3-dev \
            qt6-webengine-dev \
            libudev-dev \
            pkg-config

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build .deb
        # `bash deb/build-deb.sh` rather than `./deb/build-deb.sh`:
        # deliberately doesn't rely on git having tracked this file's
        # executable bit correctly (found from a real CI failure --
        # "Permission denied", exit 126 -- on a fresh runner checkout).
        run: bash deb/build-deb.sh "${{ needs.check.outputs.nightly_version }}"

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: dist/arexibo_*.deb

  windows:
    name: Build the Windows installer
    needs: check
    if: needs.check.outputs.skip != 'true'
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.check.outputs.windows_version }}
      # Named as the .deb packages are, with the same version (GitHub turns
      # the `~` into a `.` in both names).
      installer_name: arexibo_${{ needs.check.outputs.nightly_version }}-win64
      skip_folder_artifact: true

  publish:
    name: Publish nightly release
    # Windows is not waited on to publish: while that port is experimental,
    # a failure of it must not hold back the .deb packages.
    needs: [check, build, windows]
    if: ${{ !cancelled() && needs.check.outputs.skip != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write  # needed to create/update the release and its tag
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: deb-*
          merge-multiple: true

      - name: Download the Windows installer
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: arexibo-windows-installer
          path: dist

      # The files of the previous nights are deleted AFTER the new ones are
      # published, never before: if the publication fails, yesterday's files
      # stay, and the release is never empty. They are found by their ids,
      # not by their names: GitHub changes characters in a name (the `~`).
      - name: Remember the files of the previous nights
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/releases/tags/nightly" --jq '.assets[].id' > previous-assets.txt || : > previous-assets.txt
          echo "Files of the previous nights: $(wc -l < previous-assets.txt)"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly build (${{ needs.check.outputs.nightly_version }})"
          body: |
            Automated nightly build from commit ${{ github.sha }}.

            **Not a stable release** -- built directly from the tip of
            `master` every night, may include untested or in-progress
            changes. Use a tagged release for production deployments.

            The Windows installer (`arexibo_<version>-win64.exe`) is
            experimental and not signed; it is missing when its build fails.

            MP4 videos (H.264/AAC) do not play with the Windows installer: the
            Qt WebEngine it contains has no proprietary codecs (see the README,
            section "Windows (experimental)").
          prerelease: true
          # Overwrites the previous nightly's assets/tag/body each time
          # -- keeps a single, stable download URL rather than
          # accumulating a new release every night.
          make_latest: false
          files: |
            dist/arexibo_*.deb
            dist/arexibo_*-win64.exe

      - name: Delete the files of the previous nights
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          while read -r id; do
            [ -n "$id" ] || continue
            # One that the new file of the same name replaced is gone already.
            gh api -X DELETE "repos/${REPO}/releases/assets/${id}" && echo "Deleted ${id}" || echo "Already gone: ${id}"
          done < previous-assets.txt
