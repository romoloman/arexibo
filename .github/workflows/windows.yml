name: Windows build (experimental)

# The Windows port is a work in progress: this runs only by hand (Actions >
# Windows build > Run workflow), not on every push, so that it cannot turn
# the other checks red. It builds with MSVC and Qt 6 (QtWebEngine is only
# built for the MSVC kits) and uploads the executable with Qt's libraries.

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
      - name: Build
        run: cargo build --release --locked
      - name: Gather the executable and Qt's libraries
        shell: bash
        run: |
          mkdir dist-windows
          cp target/release/arexibo.exe dist-windows/
          windeployqt --release --no-translations dist-windows/arexibo.exe
      - uses: actions/upload-artifact@v4
        with:
          name: arexibo-windows
          path: dist-windows
