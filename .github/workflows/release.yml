name: Release build

# Trigger separato e indipendente dalla nightly (.github/workflows/nightly-deb.yml,
# NON toccato da questo file) -- build/pubblicazione volutamente
# duplicate qui piuttosto che condivise, cosi' un errore in questo
# workflow non puo' mai rompere la nightly che funziona gia'.

on:
  push:
    tags:
      - 'v*'

jobs:
  release-deb:
    name: Build release .deb (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --disable-warning=DEP0040
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libdbus-1-dev \
            libzmq3-dev \
            qt6-webengine-dev \
            libudev-dev \
            pkg-config

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Determine version from tag
        id: version
        run: |
          # es. tag "v0.7.0" -> versione "0.7.0" (toglie solo la v iniziale)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Build .deb
        run: bash deb/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/arexibo_*.deb
    