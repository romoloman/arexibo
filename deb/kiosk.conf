# X11 kiosk environment configuration for arexibo.
# Sourced by /usr/bin/arexibo-kiosk-start before launching arexibo --
# these defaults match the totem's own known hardware
# adjust and restart the service
# (systemctl restart arexibo.service) if hardware changes.

# NOTE: screen rotation is NOT configured here -- on this hardware's
# Intel GPU, rotating via xrandr at runtime caused non-smooth scrolling
# in some web content (tickers/marquees). Rotation is instead applied
# at the Xorg driver level (/etc/X11/xorg.conf.d/20-intel-tearfree.conf,
# see the deployment guide's section on Intel GPUs) -- applying it both
# there AND here via xrandr would double-rotate the output. If a future
# deployment's hardware doesn't need the Xorg-level TearFree config,
# the xrandr-based approach can be restored here (see arexibo-kiosk-start's
# own comments for how it was removed) -- just don't combine both.

# Touchscreen calibration (leave both empty to skip entirely). Run
# `xinput list` to find the exact device name if this ever needs
# changing (e.g. different touch controller). The matrix below matches
# a "left" rotation (whichever layer applies it, Xorg driver or xrandr)
# -- if the rotation changes, this will likely need to change too (test
# for mirrored/offset touch input).
# TOUCH_DEVICE="Weida Hi-Tech CoolTouch System"
# TOUCH_MATRIX="0 -1 1 1 0 0 0 0 1"

# Audio (0 = unmuted, 1 = muted; volume as a percentage)
AUDIO_MUTE="0"
AUDIO_VOLUME="0"

# Extra QtWebEngine/Chromium flags (leave empty to skip). Combined with
# arexibo's own required flag (--disable-pinch) by arexibo-kiosk-start,
# not overwriting it -- see gui/lib.cpp's own fix for why this matters
# (an earlier version of arexibo silently discarded any externally-set
# QTWEBENGINE_CHROMIUM_FLAGS value entirely).
#
# On this hardware's Intel GPU, these specific flags were needed for
# smooth scrolling in some web content -- see the deployment guide's
# section on Intel GPUs for the full context. Not necessarily needed
# or safe on other hardware (--ignore-gpu-blocklist in particular
# forces Chromium to ignore its own list of known-problematic GPU/
# driver combinations, which could make things *worse* on hardware
# where that list exists for a good reason) -- clear this if adjusting
# for different hardware, don't carry it forward by default.
EXTRA_CHROMIUM_FLAGS="--ignore-gpu-blocklist --enable-gpu-rasterization --disable-features=UseChromeOSDirectVideoDecoder"

# Font scaling (leave empty to skip -- no correction applied). Numeric
# multiplier applied globally to font sizes, to correct for rendering
# differences compared to a reference client on a different platform
# (e.g. 0.92 to shrink all fonts by 8%). Read directly by arexibo
# itself via the AREXIBO_FONT_SCALE environment variable -- set here
# (exported by arexibo-kiosk-start immediately before launching
# arexibo) rather than via `systemctl edit`'s Environment=, since this
# keeps every deployment-specific tuning knob in the same file instead
# of split across two different places.
# FONT_SCALE="0.91"
